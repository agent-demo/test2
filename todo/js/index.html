<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Toradora — Vanilla JS</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="container">
      <header>
        <p class="eyebrow">GDG GLAU applicant track</p>
        <h1>Toradora</h1>
        <p>A client-side todo list. Your tasks stay in this browser.</p>
      </header>

      <form id="task-form" class="task-form">
        <label for="task-input">New task</label>
        <div class="form-row">
          <input id="task-input" name="task" type="text" placeholder="What needs doing?" required>
          <select id="priority-input" name="priority" aria-label="Priority">
            <option value="1">High priority</option>
            <option value="2" selected>Medium priority</option>
            <option value="3">Low priority</option>
          </select>
          <button type="submit">Add task</button>
        </div>
        <label class="checkbox-label">
          <input id="long-term-input" name="longTerm" type="checkbox">
          Long-term task (always visible)
        </label>
      </form>

     <div class="toolbar">
  <h2>Tasks</h2>

  <div>
    <label for="priority-filter">Priority:</label>
    <select id="priority-filter">
      <option value="all">All</option>
      <option value="1">High</option>
      <option value="2">Medium</option>
      <option value="3">Low</option>
    </select>
    
     <button id="clear-completed" type="button">
      Clear completed
    </button>
    <button id="export-json" type="button">
  Export JSON
</button>

<button id="import-json" type="button">
  Import JSON
</button>

<input
  id="import-file"
  type="file"
  accept=".json,application/json"
  hidden
>
    <label>
      <input id="show-all" type="checkbox">
      Show completed
    </label>
  </div>
</div>
      <div id="task-groups" aria-live="polite"></div>
      <p id="empty-state" class="empty-state" hidden>No tasks yet. Add your first one above.</p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
